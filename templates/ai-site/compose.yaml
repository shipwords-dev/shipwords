# One machine running this site: the site itself, its Postgres and the compose service (video stitching; only effect sites need it).
# Settings and secrets come from .env next to this file (see .env.example); the values below override the ones that depend on how
# the services reach each other.
#
#   docker compose up -d --build              start or update everything
#   docker compose run --rm site node migrate.mjs   apply migrations (do this before starting a version with schema changes)
#   docker compose logs -f site
#
# Several sites on one machine share one Postgres (a database and role per site) and one compose service: point DATABASE_URL and
# COMPOSE_URL at those instead of the db and compose services below.

name: ai-site

services:
  site:
    build:
      # The workspace root: the site depends on packages next to it.
      context: ../..
      dockerfile: templates/ai-site/Dockerfile
      args:
        SITE: templates/ai-site
    env_file: .env
    environment:
      DATABASE_URL: postgres://site:site@db:5432/site
      COMPOSE_URL: http://compose:8080
      PORT: "3000"
    ports:
      # Put a reverse proxy (or Cloudflare in front of one) on the public side; only accept Cloudflare's address ranges there, since
      # guest quotas trust the cf-connecting-ip header.
      - 127.0.0.1:3000:3000
    depends_on:
      db:
        condition: service_healthy
    # On docker stop the job worker finishes the steps in flight and hands its runs back; give it time before the kill.
    stop_grace_period: 90s
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: site
      POSTGRES_PASSWORD: site
      POSTGRES_DB: site
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U site -d site]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  compose:
    build: ../../packages/jobs/compose
    restart: unless-stopped

volumes:
  db: {}
